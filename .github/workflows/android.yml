name: Publish Android APK Release
on:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24

    - name: Set up Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Dependencies & Build Web App
      env:
        VITE_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: |
        npm install
        npm run build

    - name: Convert Clicker Game to Android Package
      run: |
        npm install @capacitor/core @capacitor/cli
        
        # FIXED: Passes parameters correctly without using the invalid --noprompt flag
        npx cap init "Clicker Game" "com.juannity.clicker" --web-dir=dist
        
        npm install @capacitor/android
        npx cap add android
        npx cap sync
        
        # Moves into the generated android container to build the app
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug
        
        # Copies the final clicker game package to the main root folder
        cp app/build/outputs/apk/debug/app-debug.apk ../clicker-game.apk

    - name: Create GitHub Release and Upload APK Asset
      uses: softprops/action-gh-release@v3
      with:
        tag_name: v1.0.${{ github.run_number }}
        name: Clicker Game Release v1.0.${{ github.run_number }}
        body: |
          Your custom Gemini AI Clicker Game mobile build is ready!
          Download the `clicker-game.apk` file below to install and play offline on your phone.
        draft: false
        prerelease: false
        fail_on_unmatched_files: true
        files: clicker-game.apk
