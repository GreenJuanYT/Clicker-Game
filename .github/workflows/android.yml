name: Publish Android APK Release
on:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install Dependencies & Build Web App
      env:
        VITE_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: |
        npm install
        npm run build

    - name: Convert Web App to Android Using Capacitor
      run: |
        # Install the mobile wrapper tools
        npm install @capacitor/core @capacitor/cli
        
        # Configure Capacitor to point to your build output folder
        npx cap init "Clicker Game" "com.juannity.clicker" --web-dir=dist --noprompt
        
        # Pull in the Android library and prepare the asset package
        npm install @capacitor/android
        npx cap add android
        npx cap sync
        
        # Move into the native folder and run a clean headless build
        cd android
        ./gradlew assembleDebug
        
        # Copy the finished mobile app package up to the root folder
        cp app/build/outputs/apk/debug/app-debug.apk ../clicker-game.apk

    - name: Create GitHub Release and Upload APK Asset
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.${{ github.run_number }}
        name: Clicker Game Release v1.0.${{ github.run_number }}
        body: |
          Automated mobile application build compiled with Gemini AI integration.
          Download the raw `.apk` file below to install and play offline on your Android device.
        draft: false
        prerelease: false
        fail_on_unmatched_files: true # Forces GitHub to show an error if the APK fails to build!
        files: clicker-game.apk
